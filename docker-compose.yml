version: '3.8'

services:
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
